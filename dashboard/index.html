<!DOCTYPE html>
<html>

<head>
    <title>Playwright Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🚀 Playwright Automation Dashboard</h1>

<div class="card">
    <h2>Status</h2>
    <h3 id="status">Loading...</h3>
</div>

<div class="card">
    <h2>Passed</h2>
    <h3 id="passed">0</h3>
</div>

<div class="card">
    <h2>Failed</h2>
    <h3 id="failed">0</h3>
</div>

<div class="card">
    <h2>Skipped</h2>
    <h3 id="skipped">0</h3>
</div>

<div class="card">
    <h2>Duration</h2>
    <h3 id="duration">Loading...</h3>
</div>

<div class="card">
    <h2>Branch</h2>
    <h3 id="branch">Loading...</h3>
</div>

<div class="card">
    <h2>Run</h2>
    <h3 id="run">Loading...</h3>
</div>

<script src="app.js"></script>

</body>

</html>
