name: Playwright Tests

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install
      - name: Run Playwright Tests
        run: npx playwright test
      - name: Run Cucumber Tests
        if: always()
        run: npx cucumber-js --parallel 2 --retry 1 --format html:cucumber-report.html
      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report
      - name: Generate Dashboard JSON
        if: always()
        run: node scripts/generateDashboard.js
      - name: Prepare GitHub Pages
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force site
          Copy-Item dashboard\* site\ -Recurse -Force
          Copy-Item playwright-report site\playwright-report -Recurse -Force
          Copy-Item allure-report site\allure-report -Recurse -Force
          if (Test-Path "cucumber-report.html") {
            Copy-Item cucumber-report.html site\ -Force
          }
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
      - name: Upload Dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dashboard/
      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.html
          if-no-files-found: ignore
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4